[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingagents"
version = "0.2.3"
description = "TradingAgents: Multi-Agents LLM Financial Trading Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.13",
    "apscheduler>=3.10",
    "backtrader>=1.9.78.123",
    "bcrypt>=4.1",
    "cryptography>=43.0",
    "croniter>=2.0",
    "fastapi>=0.115",
    "langchain>=1.0",
    "langchain-anthropic>=1.0",
    "langchain-core>=1.0",
    "langchain-experimental>=0.3.4",
    "langchain-google-genai>=4.0.0",
    "langchain-openai>=1.0",
    "langgraph>=1.0",
    "pandas>=2.3.0",
    "parsel>=1.10.0",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.9",
    "pytz>=2025.2",
    "questionary>=2.1.0",
    "rank-bm25>=0.2.2",
    "redis>=6.2.0",
    "requests>=2.32.4",
    "rich>=14.0.0",
    "setuptools>=80.9.0",
    "sqlalchemy>=2.0",
    "sse-starlette>=2.1",
    "stockstats>=0.6.5",
    "tqdm>=4.67.1",
    "typer>=0.21.0",
    "typing-extensions>=4.14.0",
    "uvicorn[standard]>=0.32",
    "yfinance>=0.2.63",
]

[project.scripts]
tradingagents = "cli.main:app"
tradingagents-web = "tradingagents_web.cli:app"

[tool.setuptools.packages.find]
include = ["tradingagents*", "tradingagents_web*", "cli*"]

[tool.setuptools.package-data]
cli = ["static/*"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.15.12",
]

[tool.ruff]
line-length = 200
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]
ignore = [
    "B008",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
